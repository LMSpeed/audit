name: Verify standalone audit engine
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack --pack-destination .cache/package
      - run: pnpm release:prepare
      - run: pnpm release:smoke
      - name: Verify generated installer formatting
        run: |
          pnpm exec biome format --stdin-file-path=bucket/lmspeed-audit.json < .cache/release/lmspeed-audit.json > .cache/formatted-scoop.json
          diff -u .cache/release/lmspeed-audit.json .cache/formatted-scoop.json
